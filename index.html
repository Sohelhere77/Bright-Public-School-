<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Public School</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;800&family=Noto+Sans+Devanagari:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--brown:#2B1B14;--green:#1F3D2B;--sand:#E9DFC9;--gold:#C9A24B;--bg:#FAF8F4;--ink:#2B1B14;--mut:#6B5B50;--line:#E3DACB;--f:'Plus Jakarta Sans','Noto Sans Devanagari',sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:68px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif}
.w{max-width:1040px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:9;background:var(--brown);color:#fff}
header .w{display:flex;align-items:center;justify-content:space-between;height:60px;gap:10px}
.logo{font:800 17px var(--f);color:#fff;text-decoration:none}
nav{display:flex;gap:16px;overflow-x:auto;font-size:14px}
nav a{color:var(--sand);text-decoration:none;white-space:nowrap}
#lang{background:var(--gold);color:var(--brown);border:0;border-radius:6px;padding:6px 10px;font:600 13px var(--f);cursor:pointer}
.hero{background:linear-gradient(135deg,var(--green),var(--brown));color:#fff;padding:60px 0}
.hero h1{font:800 clamp(32px,7vw,56px)/1.15 var(--f);margin:0 0 14px;max-width:16ch}
.hero p{max-width:48ch;color:var(--sand);margin:0 0 24px}
.btn{display:inline-block;background:var(--gold);color:var(--brown);padding:12px 22px;border-radius:8px;text-decoration:none;font-weight:600}
section{padding:52px 0}.alt{background:#fff;border-block:1px solid var(--line)}
h2{font:800 clamp(24px,4vw,32px)/1.2 var(--f);color:var(--green);margin:0 0 18px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{background:#fff;border:1px solid var(--line);border-top:4px solid var(--green);border-radius:8px;padding:16px}
.card h3{margin:0 0 4px;font-size:18px}.card small{color:var(--mut)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;margin-bottom:10px;background:var(--sand)}
table{border-collapse:collapse;width:100%;max-width:560px;background:#fff}
td,th{padding:10px 12px;border:1px solid var(--line);text-align:left;font-size:15px}th{background:var(--sand)}
.gal{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.gal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px}
.n{padding:12px 0;border-top:1px solid var(--line);max-width:720px}.n time{color:var(--green);font-weight:600;font-size:14px}
.n b{display:block}.mut{color:var(--mut)}
footer{background:var(--brown);color:var(--sand);padding:26px 0;font-size:14px}
a.adm{color:var(--gold)}

body{padding-bottom:calc(66px + env(safe-area-inset-bottom,0px))}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--brown);border-top:1px solid #4a3328;padding-bottom:env(safe-area-inset-bottom,0px)}
#bar button{flex:1;background:none;border:0;color:var(--sand);padding:8px 0 6px;font:600 12px var(--f);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
#bar button span{font-size:20px;line-height:1}#bar button.on{color:var(--gold)}
#sheet{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet[hidden]{display:none}
.sh{background:var(--bg);width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(84px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.shg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.shg button{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;font:600 14px var(--f);color:var(--brown);cursor:pointer;display:flex;gap:8px;align-items:center}
#panelView{padding:24px 0 40px;min-height:70vh}
#panelView h2{margin-bottom:4px}
#panelView input,#panelView select,#panelView textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:6px;background:#fff;margin:3px 0 10px;font:inherit;color:var(--ink)}
#panelView label{display:block;font-size:14px}
#panelView button{background:var(--green);color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font:inherit}
#panelView button.g{background:var(--gold);color:var(--brown)}
#panelView button.r{background:#8B2E2E;padding:5px 9px;font-size:13px}
#panelView button:disabled{opacity:.6}
#panelView .f{display:grid;gap:0 12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
#panelView table{max-width:none;font-size:14px}
#panelView td select{margin:0;padding:5px}#panelView td button{margin:2px 0}
#panelView .box{max-width:360px;margin:20px auto;padding:20px;background:#fff;border:1px solid var(--line);border-radius:10px}
#panelView .msg{color:#8B2E2E}#panelView .ok{color:var(--green);font-weight:600}
#panelView .att label{display:inline;margin-right:10px;white-space:nowrap}#panelView .att input{width:auto;margin:0 3px 0 0}
#panelView .wrap{overflow-x:auto}
</style>
</head>
<body>
<header><div class="w">
<a class="logo" href="#top" data-n></a>
<nav><a href="#admission" data-i="nav_adm"></a><a href="#fees" data-i="nav_fee"></a><a href="#teachers" data-i="nav_tch"></a><a href="#gallery" data-i="nav_gal"></a><a href="#notices" data-i="nav_not"></a><a href="#contact" data-i="nav_con"></a></nav>
<button id="lang">English</button>
</div></header>
<div id="site"><main id="top">
<div class="hero"><div class="w">
<h1 data-s="h1"></h1><p data-s="sub"></p><a class="btn" href="#admission" data-i="apply"></a>
</div></div>
<section id="admission"><div class="w"><h2 data-i="nav_adm"></h2>
<p data-s="adm_p" class="mut"></p><ul id="docs"></ul></div></section>
<section id="fees" class="alt"><div class="w"><h2 data-i="nav_fee"></h2>
<table><tr><th data-i="cls"></th><th data-i="adm_fee"></th><th data-i="mon_fee"></th></tr><tbody id="feerows"></tbody></table>
<p class="mut" data-s="fee_note"></p></div></section>
<section id="teachers"><div class="w"><h2 data-i="nav_tch"></h2><div class="grid" id="tch"></div></div></section>
<section id="gallery" class="alt"><div class="w"><h2 data-i="nav_gal"></h2><div class="gal" id="gal"></div></div></section>
<section id="notices"><div class="w"><h2 data-i="nav_not"></h2><div id="not"></div></div></section>
<section id="contact" class="alt"><div class="w"><h2 data-i="nav_con"></h2>
<p><b data-i="addr_l"></b><br><span id="addr"></span></p>
<p><b data-i="ph_l"></b><br><a id="ph"></a></p>
<p id="emp" hidden><b>Email</b><br><a id="em"></a></p>
<p><b data-i="tm_l"></b><br><span data-s="hours"></span></p></div></section>
</main>
<footer><div class="w">© 2026 <span data-n></span> · CBSE · <a class="adm" href="#" id="fl">Staff login</a></div></footer></div>
<div id="panelView" hidden><div class="w"><h2 id="ptitle"></h2><p class="mut" id="pwho" style="margin:0 0 14px"></p><div id="pmain"></div></div></div>
<nav id="bar"><button id="bHome" class="on"><span>🏠</span>Home</button><button id="bMenu"><span>👤</span>Staff login</button></nav>
<div id="sheet" hidden><div class="sh" id="shBody"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="defaults.js"></script>
<script>
const T={hi:{nav_adm:"प्रवेश",nav_fee:"शुल्क",nav_tch:"शिक्षक",nav_gal:"गैलरी",nav_not:"सूचना",nav_con:"संपर्क",apply:"प्रवेश के लिए आवेदन",cls:"कक्षा",adm_fee:"प्रवेश शुल्क",mon_fee:"मासिक शुल्क",addr_l:"पता",ph_l:"फोन",tm_l:"ऑफिस समय",none:"अभी कुछ नहीं है।",lng:"English"},
en:{nav_adm:"Admission",nav_fee:"Fees",nav_tch:"Teachers",nav_gal:"Gallery",nav_not:"Notices",nav_con:"Contact",apply:"Apply for admission",cls:"Class",adm_fee:"Admission fee",mon_fee:"Monthly fee",addr_l:"Address",ph_l:"Phone",tm_l:"Office hours",none:"Nothing here yet.",lng:"हिन्दी"}};
let L=localStorage.getItem('lang')||'hi',S={},D={},ME=null;
const sb=CONFIG.url.includes('YOUR-')?null:supabase.createClient(CONFIG.url,CONFIG.key);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const v=k=>(S[k]!=null&&S[k]!=='')?S[k]:DEF[k];
const lv=k=>v(k+'_'+L);
const lines=s=>String(s||'').split('\n').filter(x=>x.trim());
function paint(){
 document.documentElement.lang=L;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=T[L][e.dataset.i]);
 document.querySelectorAll('[data-s]').forEach(e=>e.textContent=lv(e.dataset.s));
 document.querySelectorAll('[data-n]').forEach(e=>e.textContent=v('school_name'));
 document.title=v('school_name');
 $('lang').textContent=T[L].lng;
 $('docs').innerHTML=lines(lv('docs')).map(x=>`<li>${esc(x)}</li>`).join('');
 $('feerows').innerHTML=lines(v('fees')).map(r=>{const c=r.split('|').map(s=>s.trim());return `<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[2])}</td></tr>`}).join('');
 $('addr').textContent=v('address');
 const p=v('phone');$('ph').textContent=p;$('ph').href='tel:'+p.replace(/[^+\d]/g,'');
 const e=v('email');$('emp').hidden=!e;$('em').textContent=e;$('em').href='mailto:'+e;
 const none=`<p class="mut">${T[L].none}</p>`;
 $('tch').innerHTML=(D.t||[]).map(x=>`<div class="card">${x.photo_url?`<img src="${esc(x.photo_url)}" alt="">`:''}<h3>${esc(x.name)}</h3><small>${esc(x.subject)}${x.qualification?' · '+esc(x.qualification):''}</small></div>`).join('')||none;
 $('gal').innerHTML=(D.g||[]).map(x=>`<img src="${esc(x.url)}" alt="${esc(x.caption)}">`).join('')||none;
 $('not').innerHTML=(D.n||[]).map(x=>`<div class="n"><time>${esc(x.date)}</time><b>${esc(x.title)}</b><span class="mut">${esc(x.body)}</span></div>`).join('')||none;
}
$('lang').onclick=()=>{L=L==='hi'?'en':'hi';localStorage.setItem('lang',L);paint()};
async function load(){
 if(!sb)return;
 const [t,g,n,s]=await Promise.all([sb.from('teachers').select('*').order('created_at'),sb.from('gallery').select('*').order('created_at',{ascending:false}),sb.from('notices').select('*').order('date',{ascending:false}).limit(10),sb.from('site_settings').select('*')]);
 D={t:t.data,g:g.data,n:n.data};
 S=Object.fromEntries((s.data||[]).map(r=>[r.key,r.value]));
 paint();
}

/* ---------- Staff panel (same page) ---------- */
const POSTS=["Principal","Vice Principal","Teacher","Clerk","Peon","Driver","Other"];
const ACC={admin:"Full control (Admin)",teacher:"Teacher (students, attendance, notices)",staff:"Basic (sirf notices dekhna)"};
const isAdm=()=>ME&&(ME.access==='owner'||ME.access==='admin');
const allowed=k=>isAdm()||(ME.access==='teacher'?['students','sa','notices'].includes(k):k==='notices');
async function fn(body){
 const {data,error}=await sb.functions.invoke('staff-admin',{body});
 if(error)throw new Error(error.message);
 if(data&&data.error)throw new Error(data.error);
 return data;
}
const TABS={
 site:{label:'Website edit',run:siteTab},
 staff:{label:'Staff / Login',run:staffTab},
 students:{label:'Students / छात्र',run:()=>crud('students',[['name','Name / नाम'],['class','Class / कक्षा','sel'],['roll','Roll no','number'],['father_name',"Father's name"],['mother_name',"Mother's name"],['phone','Phone'],['address','Address'],['dob','Date of birth','date']],['class','roll','name','father_name','phone'],'class',false,!isAdm())},
 sa:{label:'Student attendance',run:()=>attendance('students','student_attendance','student_id',true)},
 ta:{label:'Teacher attendance',run:()=>attendance('teachers','teacher_attendance','teacher_id',false)},
 teachers:{label:'Teachers / शिक्षक',run:()=>crud('teachers',[['name','Name'],['subject','Subject'],['qualification','Qualification'],['photo_url','Photo (upload karein)','photo']],['photo_url','name','subject','qualification'],'created_at')},
 notices:{label:'Notices / सूचना',run:()=>crud('notices',[['title','Title'],['body','Details'],['date','Date','date']],['date','title','body'],'date',true,ME.access==='staff')},
 gallery:{label:'Gallery',run:()=>crud('gallery',[['url','Photos (ek saath kai chun sakte hain)','photos'],['caption','Caption (optional)']],['url','caption'],'created_at',true)}
};

const ICON={site:'✏️',staff:'👥',students:'🎓',sa:'✅',ta:'🧑‍🏫',teachers:'👩‍🏫',notices:'📢',gallery:'🖼️'};
const setBar=a=>{$('bHome').classList.toggle('on',a==='home');$('bMenu').classList.toggle('on',a==='panel')};
function showSite(){$('site').hidden=false;$('panelView').hidden=true;$('sheet').hidden=true;setBar('home');window.scrollTo(0,0)}
function showPanel(){$('site').hidden=true;$('panelView').hidden=false;$('sheet').hidden=true;setBar('panel');window.scrollTo(0,0)}
const barLabel=()=>{$('bMenu').innerHTML=ME?'<span>☰</span>Panel':'<span>👤</span>Staff login'};
async function loadMe(){
 if(!sb)return false;
 const {data:{session}}=await sb.auth.getSession();
 if(!session){ME=null;barLabel();return false}
 const {data}=await sb.from('staff').select('*').eq('user_id',session.user.id).maybeSingle();
 if(!data){await sb.auth.signOut();ME=null;barLabel();if($('lm'))$('lm').textContent='Aapka Gmail staff list mein nahi hai.';return false}
 ME=data;barLabel();return true;
}
function showLogin(){
 showPanel();$('ptitle').textContent='Staff login';$('pwho').textContent='';
 $('pmain').innerHTML='<div class="box"><label>Gmail<input id="lem" type="email" autocomplete="username"></label><label>Password<input id="lpw" type="password" autocomplete="current-password"></label><button id="go">Login</button><p class="msg" id="lm"></p><p class="mut"><small>Password bhool gaye? Admin se naya password banwayein.</small></p></div>';
 $('go').onclick=async()=>{
  if(!sb){$('lm').textContent='Supabase set nahi hai (config.js)';return}
  const {error}=await sb.auth.signInWithPassword({email:$('lem').value.trim().toLowerCase(),password:$('lpw').value});
  if(error){$('lm').textContent=error.message;return}
  if(await loadMe())goFirst();
 };
}
function openTab(k){
 showPanel();$('ptitle').textContent=TABS[k].label;
 $('pwho').textContent=(ME.name||ME.email)+' · '+(ME.post||ME.access)+(ME.access==='owner'?' (Owner)':'');
 TABS[k].run();
}
const goFirst=()=>openTab(Object.keys(TABS).filter(allowed)[0]);
function openSheet(){
 const keys=Object.keys(TABS).filter(allowed);
 $('shBody').innerHTML=`<p class="mut" style="margin:0 0 10px">${esc(ME.name||ME.email)} · ${esc(ME.post||ME.access)}</p><div class="shg">${keys.map(k=>`<button data-k="${k}"><span>${ICON[k]}</span>${TABS[k].label}</button>`).join('')}<button data-act="pw"><span>🔑</span>Change password</button><button data-act="out"><span>🚪</span>Logout</button></div>`;
 $('sheet').hidden=false;
}
$('sheet').onclick=async e=>{
 if(e.target.id==='sheet'){$('sheet').hidden=true;return}
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.k)openTab(b.dataset.k);
 else if(b.dataset.act==='out'){await sb.auth.signOut();location.reload()}
 else if(b.dataset.act==='pw'){
  $('sheet').hidden=true;
  const p=prompt('Naya password (kam se kam 8 akshar)');if(!p)return;
  if(p.length<8){alert('Kam se kam 8 akshar rakhein');return}
  const {error}=await sb.auth.updateUser({password:p});alert(error?error.message:'Password badal gaya');
 }
};
$('bHome').onclick=showSite;
$('bMenu').onclick=()=>{if(!ME)return showLogin();$('sheet').hidden?openSheet():($('sheet').hidden=true)};
$('fl').onclick=e=>{e.preventDefault();$('bMenu').click()};
document.querySelector('header nav').addEventListener('click',()=>{if(!$('panelView').hidden)showSite()});

async function siteTab(){
 const {data}=await sb.from('site_settings').select('*');
 const S=Object.fromEntries((data||[]).map(r=>[r.key,r.value]));
 $('pmain').innerHTML='<p>Yahan se website ka text badlein. Save karte hi website par badal jata hai.</p>'+SITE_FIELDS.map(([k,l,t])=>`<label>${l}${t==='area'?`<textarea id="s_${k}" rows="3"></textarea>`:`<input id="s_${k}">`}</label>`).join('')+'<button id="ssv">Save website</button> <span id="e"></span>';
 SITE_FIELDS.forEach(([k])=>$('s_'+k).value=(S[k]!=null&&S[k]!=='')?S[k]:(DEF[k]||''));
 $('ssv').onclick=async()=>{
  const rows=SITE_FIELDS.map(([k])=>({key:k,value:$('s_'+k).value,updated_at:new Date().toISOString()}));
  const {error}=await sb.from('site_settings').upsert(rows,{onConflict:'key'});
  $('e').className=error?'msg':'ok';$('e').textContent=error?error.message:'Saved ✓ Ab website par dekhein';
 };
}
const accOpts=(cur,isOwner)=>Object.entries(ACC).filter(([k])=>isOwner||k!=='admin'||cur==='admin').map(([k,l])=>`<option value="${k}" ${k===cur?'selected':''}>${l}</option>`).join('');
async function staffTab(){
 const isOwner=ME.access==='owner';
 $('pmain').innerHTML=`<h3>Naya staff add karein</h3><div class="f"><label>Name<input id="sn"></label><label>Post<select id="sp">${POSTS.map(p=>`<option>${p}</option>`).join('')}</select></label><label>Gmail<input id="se" type="email"></label><label>Access<select id="sx">${accOpts('staff',isOwner)}</select></label><label>Temporary password (8+ akshar)<input id="spw"></label></div><button id="sadd">Add staff</button> <span id="e"></span><h3>Staff list</h3><div class="wrap" id="sl">Loading...</div>`;
 $('sp').onchange=()=>{const p=$('sp').value;$('sx').value=((p==='Principal'||p==='Vice Principal')&&isOwner)?'admin':(p==='Teacher'?'teacher':'staff');if(!$('sx').value)$('sx').value='staff'};
 $('sp').onchange();
 $('sadd').onclick=async()=>{
  $('e').className='msg';$('e').textContent='Please wait...';
  try{await fn({action:'create',name:$('sn').value.trim(),post:$('sp').value,email:$('se').value,access:$('sx').value,password:$('spw').value});staffTab()}
  catch(x){$('e').textContent=x.message}
 };
 const {data,error}=await sb.from('staff').select('*').order('created_at');
 if(error){$('sl').textContent=error.message;return}
 $('sl').innerHTML=`<table><tr><th>Name</th><th>Post</th><th>Gmail</th><th>Access</th><th></th></tr>${data.map(r=>{
  const can=r.user_id!==ME.user_id&&r.access!=='owner'&&(isOwner||r.access!=='admin');
  return `<tr><td>${esc(r.name)}</td><td>${esc(r.post)}</td><td>${esc(r.email)}</td><td>${can?`<select data-a="${r.user_id}">${accOpts(r.access,isOwner)}</select>`:esc(r.access)}</td><td>${can?`<button data-pw="${r.user_id}">Password</button> <button class="r" data-rm="${r.user_id}">Remove</button>${isOwner?` <button class="g" data-ow="${r.user_id}">Make Owner</button>`:''}`:''}</td></tr>`}).join('')}</table>`;
 const run=async f=>{try{await f();staffTab()}catch(x){alert(x.message)}};
 $('sl').onchange=e=>{const id=e.target.dataset.a;if(id)run(()=>fn({action:'update',user_id:id,access:e.target.value}))};
 $('sl').onclick=e=>{const d=e.target.dataset;
  if(d.pw){const p=prompt('Is staff ka naya password (8+ akshar)');if(p)run(()=>fn({action:'update',user_id:d.pw,password:p}))}
  else if(d.rm){if(confirm('Is staff ka login hamesha ke liye hata dein?'))run(()=>fn({action:'remove',user_id:d.rm}))}
  else if(d.ow){if(confirm('Ye staff Owner ban jayega aur aap Admin ban jayenge. Pakka?'))run(async()=>{await fn({action:'make_owner',user_id:d.ow});location.reload()})}
 };
}

async function shrink(file){
 return new Promise(res=>{const img=new Image();
  img.onload=()=>{const m=1280,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(bl=>res(bl||file),'image/jpeg',0.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)});
}
async function upPhoto(file,folder){
 const b=await shrink(file);
 const p=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
 const {error}=await sb.storage.from('photos').upload(p,b,{contentType:b.type||'image/jpeg'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
}
async function crud(table,fields,cols,order,desc,ro){
 const m=$('pmain');
 const inp=([k,l,t])=>t==='sel'?`<label>${l}<select id="f_${k}">${CONFIG.classes.map(c=>`<option>${c}</option>`).join('')}</select></label>`:(t==='photo'||t==='photos')?`<label>${l}<input id="f_${k}" type="file" accept="image/*" ${t==='photos'?'multiple':''}></label>`:`<label>${l}<input id="f_${k}" type="${t||'text'}"></label>`;
 m.innerHTML=(ro?'':`<div class="f">${fields.map(inp).join('')}</div><button id="add">Add / जोड़ें</button> <span class="msg" id="e"></span>`)+`<h3>List</h3><div class="wrap" id="lst">Loading...</div>`;
 if(!ro)$('add').onclick=async()=>{
  const btn=$('add'),msg=$('e');msg.className='msg';
  try{
   const o={};let files=[],pk=null;
   for(const [k,,t] of fields){
    if(t==='photo'||t==='photos'){pk=k;files=[...$('f_'+k).files];continue}
    const v=$('f_'+k).value.trim();if(v)o[k]=t==='number'?+v:v}
   if(table==='gallery'&&!files.length)throw new Error('Pehle photo chunein');
   btn.disabled=true;msg.textContent='Upload ho raha hai, thoda ruko...';
   if(pk&&files.length){
    const rows=[];for(const f of files)rows.push({...o,[pk]:await upPhoto(f,table)});
    const {error}=await sb.from(table).insert(rows);if(error)throw error;
   }else{const {error}=await sb.from(table).insert(o);if(error)throw error}
   crud(table,fields,cols,order,desc,ro);
  }catch(x){btn.disabled=false;msg.textContent=x.message}
 };
 const {data,error}=await sb.from(table).select('*').order(order,{ascending:!desc});
 if(error){$('lst').textContent=error.message;return}
 const cell=(r,c)=>(c==='url'||c==='photo_url')?(r[c]?`<img src="${esc(r[c])}" alt="" style="height:48px;border-radius:4px">`:''):esc(r[c]);
 $('lst').innerHTML=`<table><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${ro?'':'<th></th>'}</tr>${data.map(r=>`<tr>${cols.map(c=>`<td>${cell(r,c)}</td>`).join('')}${ro?'':`<td><button class="r" data-id="${r.id}">Delete</button></td>`}</tr>`).join('')}</table>`;
 if(!ro)$('lst').onclick=async e=>{
  const id=e.target.dataset.id;
  if(id&&confirm('Delete karein?')){
   const r=data.find(x=>x.id===id);const u=(r&&(r.url||r.photo_url))||'';const i=u.indexOf('/photos/');
   if(i>-1)await sb.storage.from('photos').remove([decodeURIComponent(u.slice(i+8))]);
   await sb.from(table).delete().eq('id',id);crud(table,fields,cols,order,desc,ro)}
 };
}
async function attendance(list,att,idCol,byClass){
 const m=$('pmain');
 m.innerHTML=`<div class="f">${byClass?`<label>Class<select id="cl">${CONFIG.classes.map(c=>`<option>${c}</option>`).join('')}</select></label>`:''}<label>Date<input id="dt" type="date" value="${today()}"></label></div><div class="wrap" id="lst"></div><button id="sv" hidden>Save attendance</button> <span id="e"></span>`;
 const load=async()=>{
  let q=sb.from(list).select('*').order(byClass?'roll':'name');if(byClass)q=q.eq('class',$('cl').value);
  const [{data:people},{data:rec}]=await Promise.all([q,sb.from(att).select('*').eq('date',$('dt').value)]);
  const cur={};(rec||[]).forEach(r=>cur[r[idCol]]=r.status);
  $('lst').innerHTML=`<table>${(people||[]).map(p=>`<tr><td>${byClass?esc(p.roll)+'. ':''}${esc(p.name)}</td><td class="att">${['P','A','L'].map(s=>`<label><input type="radio" name="r_${p.id}" value="${s}" ${(cur[p.id]||'P')===s?'checked':''}>${s==='P'?'Present':s==='A'?'Absent':'Leave'}</label>`).join('')}</td></tr>`).join('')}</table>`;
  $('sv').hidden=!(people||[]).length;$('sv').onclick=async()=>{
   const rows=(people||[]).map(p=>({[idCol]:p.id,date:$('dt').value,status:document.querySelector(`input[name="r_${p.id}"]:checked`).value}));
   const {error}=await sb.from(att).upsert(rows,{onConflict:idCol+',date'});$('e').textContent=error?error.message:'Saved ✓';};
 };
 m.querySelectorAll('select,input').forEach(x=>x.onchange=load);load();
}

paint();load();
loadMe().then(ok=>{if(location.hash==='#panel'){ok?goFirst():showLogin()}});
</script>
</body>
</html>
