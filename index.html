<style>
:root,html[data-theme="light"]{--bg:#FFFFFF;--surface:#FFFFFF;--surface2:#F7F1EC;--ink:#2B1B14;--mut:#7A675C;--line:#E6DAD1;--accent:#6B3E26;--on:#FFFFFF;--ok:#2E7D32;--info:#1565C0;--amber:#B26A00;--red:#C62828;color-scheme:light}

body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 'Noto Sans Devanagari','Plus Jakarta Sans',sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}

button.btn{border:0;cursor:pointer}

.slw{position:relative}
.slider{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:2px 2px 12px;scrollbar-width:thin;scrollbar-color:var(--accent) var(--surface2)}
.slider>*{flex:0 0 min(86%,360px);scroll-snap-align:start;margin:0}

.arw.l{left:-6px}.arw.r{right:-6px}

.fold .shg{padding:0 10px 10px}
.shg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

const IL=()=>L==='hi'?0:L==='en'?1:2;
function trStr(s){
 const k=String(s).trim();if(!k)return s;
 const d=window.I18N&&I18N[k];
 if(d){const r=L==='hi'?d[0]:(L==='en'?d[1]:(d[2]||k));return s.replace(k,()=>r)}
 const m=k.match(/^(.*?)\s*\/\s*([\u0900-\u097F].*)$/);
 if(m)return s.replace(k,()=>L==='hi'?m[2]:m[1]);
 if(L!=='hn'&&window.I18N_RX){for(const [re,fh,fe] of I18N_RX){const x=k.match(re);if(x){const r=(L==='hi'?fh:fe)(x);return s.replace(k,()=>r)}}}
 return s;
}
function trTree(n){
 if(n.nodeType===3){const r=trStr(n.nodeValue);if(r!==n.nodeValue)n.nodeValue=r;return}
 if(n.nodeType!==1||n.tagName==='SCRIPT'||n.tagName==='STYLE'||n.tagName==='TEXTAREA')return;
 if(n.placeholder){const r=trStr(n.placeholder);if(r!==n.placeholder)n.placeholder=r}
 n.childNodes.forEach(trTree);
}
const trObs=new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trTree)));
['panelView','sheet'].forEach(id=>trObs.observe($(id),{childList:true,subtree:true}));
const _al=window.alert.bind(window),_cf=window.confirm.bind(window),_pr=window.prompt.bind(window);

async function shrink(file,mx){
 return new Promise(res=>{const img=new Image();
  img.onload=()=>{const m=mx||1280,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(bl=>res(bl||file),'image/jpeg',0.82)};
  img.onerror=()=>res(file);img.src=URL.createObjectURL(file)});
}
async function upPhoto(file,folder,mx){
 const b=await shrink(file,mx);
 const ok=/^image\/(jpeg|png|webp|gif)$/;
 if(!ok.test(b.type||''))throw new Error('Ye photo format support nahi hai. JPG ya PNG photo chunein.');
 const ext=b.type==='image/png'?'png':b.type==='image/webp'?'webp':b.type==='image/gif'?'gif':'jpg';
 const p=folder+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
 const f=new File([b],'photo.'+ext,{type:b.type});
 const {error}=await sb.storage.from('photos').upload(p,f,{contentType:b.type,cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('photos').getPublicUrl(p).data.publicUrl;
}

 if(t==='photo'||t==='photos')return `<label>${l}<input id="${pre}${k}" type="file" accept="image/*" ${t==='photos'?'multiple':''}></label>`;
 if(t.startsWith('opt:'))return `<label>${l}<select id="${pre}${k}">${t.slice(4).split('|').map(o=>{const [a,b]=o.split('=');return `<option value="${a}">${b||a}</option>`}).join('')}</select></label>`;
 return `<label>${l}<input id="${pre}${k}" type="${t}"></label>`;
};

const voiceFor=lang=>{const vs=speechSynthesis.getVoices();return vs.find(x=>x.lang===lang)||vs.find(x=>x.lang.toLowerCase().startsWith(lang.slice(0,2)))||null};
let sayId=null;
function speak(text,id){
 if(!('speechSynthesis' in window)){alert('Is browser mein voice support nahi hai');return}
 const ss=speechSynthesis;
 if(ss.speaking&&sayId===id){ss.cancel();sayId=null;return}
 ss.cancel();sayId=id;
 String(text||'').split(/\n+/).map(x=>x.trim()).filter(Boolean).forEach(chunk=>{
  const hi=/[\u0900-\u097F]/.test(chunk),u=new SpeechSynthesisUtterance(chunk);
  u.lang=hi?'hi-IN':'en-IN';const vo=voiceFor(u.lang);if(vo)u.voice=vo;u.rate=.95;
  ss.speak(u);
 });
}

const GRADE_DEF='90=A+\n80=A\n70=B+\n60=B\n50=C\n33=D\n0=E';
const gradeFor=p=>{const rows=lines(v('grade_scale')||GRADE_DEF).map(x=>x.split('=')).map(([a,b])=>[+a,(b||'').trim()]).filter(x=>!isNaN(x[0])).sort((a,b)=>b[0]-a[0]);const g=rows.find(q=>p>=q[0]);return g?g[1]:'-'};
const curSession=()=>{const d=new Date(),y=d.getFullYear(),a=d.getMonth()>=3?y:y-1;return a+'-'+String(a+1).slice(2)};
const sessList=ex=>{const st=new Set(ex.map(e=>e.session));st.add(curSession());return [...st].sort().reverse()};
const clsEn=c=>/^\d+$/.test(c)?'Class '+c:c;
async function loadExams(){const {data}=await sb.from('exams').select('*').order('session',{ascending:false}).order('sort',{ascending:true});return data||[]}
async function getCfg(examId,cls){
 const {data}=await sb.from('exam_subjects').select('*').eq('exam_id',examId).eq('class',cls).order('sort');
 if(data&&data.length)return {rows:data,saved:true};
 return {rows:subs(cls).map((s,i)=>({subject:s,max_marks:100,pass_marks:33,sort:i})),saved:false};
}
async function fetchMarks(examId,ids){const out=[];for(let i=0;i<ids.length;i+=40){const {data}=await sb.from('exam_marks').select('*').eq('exam_id',examId).in('student_id',ids.slice(i,i+40));out.push(...(data||[]))}return out}
function buildResult(cfg,mm){
 let tot=0,max=0,pass=true,complete=true;
 const detail=cfg.map(c=>{
  const m=mm[c.subject],has=!!m&&(m.absent||m.marks!=null);if(!has)complete=false;
  const mk=m&&!m.absent&&m.marks!=null?+m.marks:null;
  max+=+c.max_marks;if(mk!=null)tot+=mk;
  if((m&&m.absent)||mk==null||mk<+c.pass_marks)pass=false;
  return {subject:c.subject,max:+c.max_marks,pass:+c.pass_marks,marks:mk,absent:!!(m&&m.absent)};
 });
 const pct=max?Math.round(tot/max*10000)/100:0;
 return {detail,total:tot,max_total:max,percent:pct,grade:gradeFor(pct),result:pass?'pass':'fail',complete};
}
const infoOf=s=>({name:s.name,father:s.father_name,mother:s.mother_name,dob:s.dob});
const resRow=(examId,s,b)=>({exam_id:examId,student_id:s.id,class:s.class,roll:s.roll,info:infoOf(s),detail:b.detail,total:b.total,max_total:b.max_total,percent:b.percent,grade:b.grade,result:b.result,submitted_name:ME.name||ME.email,updated_at:new Date().toISOString()});
async function rankFor(r){
 const {data}=await sb.from('results').select('student_id,total').eq('exam_id',r.exam_id).eq('class',r.class);
 const L2=data||[];const mine=L2.find(x=>x.student_id===r.student_id);
 return {rank:1+L2.filter(x=>+x.total>+(mine?mine.total:r.total)).length,count:L2.length};
}
const rankMap=list=>{const g={};list.forEach(r=>(g[r.exam_id]=g[r.exam_id]||[]).push(r));const out={};Object.values(g).forEach(a=>a.forEach(r=>{out[r.id]={rank:1+a.filter(x=>+x.total>+r.total).length,count:a.length}}));return out};

 const pm=$('pmain');pm.innerHTML='<p class="mut">Loading...</p>';
 const {data}=await sb.from('class_fees').select('*');
 const cf=Object.fromEntries((data||[]).map(x=>[x.class,+x.amount]));

 const vals=()=>[...pm.querySelectorAll('input[data-c]')];
 const save=async()=>{const rows=vals().filter(i=>i.value!=='').map(i=>({class:i.dataset.c,amount:+i.value}));if(!rows.length)return null;const {error}=await sb.from('class_fees').upsert(rows,{onConflict:'class'});return error};
 $('cfs').onclick=async()=>{const er=await save();$('e').className=er?'msg':'ok';$('e').textContent=er?er.message:'Saved ✓'};
 $('cfa').onclick=async()=>{
  if(!confirm('Jin bachhon ka fee set nahi hai, un sab par class ki default fee lagayein?'))return;
  const m2=$('e2');m2.className='msg';m2.textContent='Please wait...';
  try{
   const er=await save();if(er)throw er;
   const cur=Object.fromEntries(vals().map(i=>[i.dataset.c,+i.value||0]));
   const st=await fetchAll(()=>sb.from('students').select('id,class').neq('status','passed_out'));

   const have=new Set(ac.map(x=>x.person_id)),sm=($('cfm').value||monthStart().slice(0,7))+'-01';
   const rows=st.filter(s=>!have.has(s.id)&&cur[s.class]>0).map(s=>({person_type:'student',person_id:s.id,mode:'auto',monthly_amount:cur[s.class],amount_override:null,start_month:sm}));
   for(let i=0;i<rows.length;i+=200){const {error}=await sb.from('accounts').insert(rows.slice(i,i+200));if(error)throw error}
   await sb.rpc('run_accrual');
   m2.className='ok';m2.textContent=`✅ ${rows.length} bachhon par lagaya.`;
  }catch(x){m2.textContent=x.message}
 };
}

/* ----- family (bhai-behan) ----- */
function calcPending(led,stu){
 let pool=led.filter(x=>x.kind!=='charge').reduce((s,x)=>s+ +x.amount,0);const out=[];
 led.filter(x=>x.kind==='charge').forEach(c=>{const t=Math.min(pool,+c.amount);pool-=t;const r=+c.amount-t;if(r>0)out.push({label:c.auto?(stu?'Monthly fee':'Monthly salary')+' · '+mlabel(c.month):(c.note||'Charge')+(c.month?' · '+mlabel(c.month):''),amt:r})});
 return out;
}
async function canvasOut(kind,c,base){
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 if(kind==='png')dl(blob,base+'.png');
 else if(kind==='share'){const f=new File([blob],base+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:base});else dl(blob,base+'.png')}
 else{await loadJsPdf();const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'px',format:[c.width,c.height],orientation:'portrait'});pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,c.width,c.height);pdf.save(base+'.pdf')}
}

  y+=48;
 });
 x.fillStyle=total>0?'#8B2E2E':'#1F3D2B';x.fillRect(40,y,W-80,92);
 x.fillStyle='#fff';x.font=F(600,22);x.fillText(total>0?'FAMILY TOTAL DUE · परिवार का कुल बकाया':'NO DUE · कोई बकाया नहीं',60,y+34);

 if(total>0){x.fillStyle='#2B1B14';x.font=F(600,21);x.fillText('कृपया बकाया शुल्क जल्द से जल्द जमा करें।',40,y);y+=34;x.fillStyle='#6B5B50';x.font=F(500,19);x.fillText('Please deposit the pending fees at the school office.',40,y)}

async function famSlipAct(kind,kids){
 const items=[];
 for(const s of kids){
  const {data}=await sb.from('ledger').select('*').eq('person_type','student').eq('person_id',s.id).order('month',{ascending:true,nullsFirst:true}).order('created_at');
  const pend=calcPending(data||[],true);items.push({s,pend,due:pend.reduce((a,r)=>a+r.amt,0)});

/* ---------- Slip (PNG / PDF / Share) ---------- */
async function makeSlip(type,p,pending,due){
 const stu=type==='student';
 try{await document.fonts.load('700 28px "Noto Sans Devanagari"');await document.fonts.load('600 22px "Plus Jakarta Sans"')}catch(e){}
 const W=800,rows=pending.slice(0,10),H=700+rows.length*40+(pending.length>10?40:0);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 const F=(w,s)=>`${w} ${s}px "Plus Jakarta Sans","Noto Sans Devanagari",sans-serif`;
 x.fillStyle='#fff';x.fillRect(0,0,W,H);
 x.fillStyle='#2B1B14';x.fillRect(0,0,W,130);
 const lg=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src='logo.png'});
 if(lg){const sz=104,ar=lg.width/lg.height;x.drawImage(lg,W-40-sz*ar,13,sz*ar,sz)}
 x.fillStyle='#fff';x.font=F(800,34);x.fillText(v('school_name'),40,60);
 x.fillStyle='#E9DFC9';x.font=F(500,20);x.fillText(v('address')+' · '+v('phone'),40,98);
 x.fillStyle='#1F3D2B';x.font=F(800,30);x.fillText(stu?'FEE REMINDER · फीस रिमाइंडर':'SALARY STATEMENT · वेतन विवरण',40,190);
 x.fillStyle='#6B5B50';x.font=F(500,20);x.textAlign='right';x.fillText('Date: '+fmt(today()),W-40,190);x.textAlign='left';
 const DL=stu?[['Name',p.name],['Class / Roll',(p.class||'')+(p.roll?' / '+p.roll:'')],["Father's name",p.father_name],['Phone',p.phone]]:[['Name',p.name],['Post',p.post],['Phone',p.phone]];
 let y=240;
 DL.forEach(([a,b])=>{x.fillStyle='#6B5B50';x.font=F(500,21);x.fillText(a,40,y);x.fillStyle='#2B1B14';x.font=F(600,23);x.fillText(String(b||'-'),260,y);y+=40});
 y+=10;
 x.fillStyle=due>0?'#8B2E2E':'#1F3D2B';x.fillRect(40,y,W-80,92);
 x.fillStyle='#fff';x.font=F(600,22);x.fillText(due>0?(stu?'TOTAL DUE · कुल बकाया':'SALARY PAYABLE · देय वेतन'):'NO DUE · कोई बकाया नहीं',60,y+34);
 x.font=F(800,38);x.fillText(money(Math.max(due,0)),60,y+76);
 y+=132;
 if(rows.length){
  x.fillStyle='#1F3D2B';x.font=F(800,21);x.fillText('Pending · बकाया विवरण',40,y);
  rows.forEach(r=>{y+=40;x.fillStyle='#2B1B14';x.font=F(500,21);x.fillText(r.label,40,y);x.textAlign='right';x.fillText(money(r.amt),W-40,y);x.textAlign='left';x.strokeStyle='#E3DACB';x.beginPath();x.moveTo(40,y+12);x.lineTo(W-40,y+12);x.stroke()});
  if(pending.length>10){y+=40;x.fillStyle='#6B5B50';x.font=F(500,20);x.fillText('+ '+(pending.length-10)+' aur mahine',40,y)}
 }
 y+=56;
 if(stu&&due>0){x.fillStyle='#2B1B14';x.font=F(600,21);x.fillText('कृपया बकाया शुल्क जल्द से जल्द जमा करें।',40,y);y+=34;x.fillStyle='#6B5B50';x.font=F(500,19);x.fillText('Please deposit the pending fees at the school office.',40,y)}
 x.fillStyle='#6B5B50';x.font=F(500,19);x.fillText('Authorised signature',W-300,H-34);
 x.strokeStyle='#6B5B50';x.beginPath();x.moveTo(W-320,H-62);x.lineTo(W-40,H-62);x.stroke();
 return c;
}
const loadJsPdf=()=>window.jspdf?Promise.resolve():new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=res;s.onerror=()=>rej(new Error('PDF library load nahi hui, internet check karein'));document.head.appendChild(s)});
async function slipAct(kind,type,p,pending,due){
 const c=await makeSlip(type,p,pending,due);
 const base=(type==='student'?'fee-slip-':'salary-')+String(p.name||'').trim().replace(/\s+/g,'-');
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
 if(kind==='png')dl(blob,base+'.png');
 else if(kind==='share'){
  const f=new File([blob],base+'.png',{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:base});else dl(blob,base+'.png');
 }else{
  await loadJsPdf();const {jsPDF}=window.jspdf;
  const pdf=new jsPDF({unit:'px',format:[c.width,c.height],orientation:'portrait'});
  pdf.addImage(c.toDataURL('image/png'),'PNG',0,0,c.width,c.height);pdf.save(base+'.pdf');
 }
}


function makeSlider(id,counter){
 const el=$(id);if(!el||el.parentNode.classList.contains('slw'))return;
 const w=document.createElement('div');w.className='slw';el.parentNode.insertBefore(w,el);w.appendChild(el);
 const mk=(c,t,d)=>{const b=document.createElement('button');b.className='arw '+c;b.textContent=t;b.setAttribute('aria-label',d);b.onclick=()=>el.scrollBy({left:(d==='prev'?-1:1)*el.clientWidth*.85,behavior:'smooth'});w.appendChild(b)};
 mk('l','‹','prev');mk('r','›','next');
 if(counter){
  const c=document.createElement('div');c.className='cnt';w.appendChild(c);
  const upd=()=>{const f=el.firstElementChild;if(!f||f.tagName==='P'){c.hidden=true;return}c.hidden=false;const step=f.getBoundingClientRect().width+14;c.textContent=Math.min(el.children.length,Math.round(el.scrollLeft/step)+1)+' / '+el.children.length};
  el.addEventListener('scroll',upd,{passive:true});new MutationObserver(upd).observe(el,{childList:true});upd();
 }
}
['tch','not','fac','bday','bdayS'].forEach(i=>makeSlider(i));
if(sb){sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&ME){ME=null;barLabel();if(!$('panelView').hidden)showLogin()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)sb.auth.getSession()})}makeSlider('gal',true);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
paint();load();
loadMe().then(ok=>{if(location.hash==='#panel'){ok?goFirst():showLogin()}});
